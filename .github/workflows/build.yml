name: Build Infinity Private

on:
  workflow_dispatch: {}        # Puedes lanzarlo a mano
  push:
    branches: [ main ]         # También se ejecuta al hacer push a main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔄 (Opcional) Sincroniza tu fork con el repo original
      - name: Sync with upstream (optional)
        run: |
          git remote add upstream https://github.com/Docile-Alligator/Infinity-For-Reddit.git || true
          git fetch upstream
          git switch -c main || git switch main
          git merge --ff-only upstream/main || true
          git push origin main || true

      # ☕ Instalar Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 🔍 Detectar compileSdk/buildTools y archivo APIUtils.java
      - name: Detect SDK info
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/build.gradle"
          [ -f app/build.gradle.kts ] && FILE="app/build.gradle.kts"

          COMPILE_SDK=$(grep -Eo 'compileSdk\s*\(?\s*[0-9]+' "$FILE" | grep -Eo '[0-9]+' | head -n1 || true)
          [ -z "${COMPILE_SDK:-}" ] && COMPILE_SDK=34
          BUILD_TOOLS=$(grep -E 'buildToolsVersion' -m1 "$FILE" | sed -E 's/.*"(.*)".*/\1/' || true)
          [ -z "${BUILD_TOOLS:-}" ] && BUILD_TOOLS="34.0.0"

          echo "compileSdk=$COMPILE_SDK"
          echo "buildTools=$BUILD_TOOLS"

          echo "COMPILE_SDK=$COMPILE_SDK" >> $GITHUB_OUTPUT
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> $GITHUB_OUTPUT

          API_FILE=$(git ls-files | grep -E 'APIUtils\.java$' || true)
          if [ -z "$API_FILE" ]; then
            API_FILE=$(git grep -l "USER_AGENT" -- app || true)
          fi
          if [ -z "$API_FILE" ]; then
            echo "❌ No se encontró APIUtils.java"; exit 1
          fi
          echo "API_FILE=$API_FILE" >> $GITHUB_OUTPUT
          echo "API_FILE=$API_FILE"

      # 📦 Instalar Android SDK
      - name: Install Android SDK (matching project)
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME"

          echo "⬇️  Descargando Command Line Tools..."
          curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools"/* "$ANDROID_HOME/cmdline-tools/latest/" || true

          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true

          echo "📦 Instalando SDK Platform y Build-Tools..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-${{ steps.detect.outputs.COMPILE_SDK }}" \
            "build-tools;${{ steps.detect.outputs.BUILD_TOOLS }}" \
            "platform-tools"

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH


      # 🧩 Inyectar API, UA, Redirect y Keystore
      - name: Inject API/UA/Redirect + Keystore
        env:
          REDDIT_API_TOKEN: ${{ secrets.REDDIT_API_TOKEN }}
          REDDIT_USERNAME:  ${{ secrets.REDDIT_USERNAME }}
          REDIRECT_URI:     ${{ secrets.REDIRECT_URI }}
          KEYSTORE_BASE64:  ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS:    ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS:        ${{ secrets.KEY_ALIAS }}
          KEY_PASS:         ${{ secrets.KEY_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          echo "🔧 Modificando APIUtils.java..."

          API_FILE=$(git ls-files | grep -E 'APIUtils\.java$' | head -n1)
          if [ -z "$API_FILE" ]; then
            echo "❌ No se encontró APIUtils.java"
            exit 1
          fi

          sed -i "s/NOe2iKrPPzwscA/${REDDIT_API_TOKEN}/g" "$API_FILE" || true
          sed -i "s#infinity://localhost#${REDIRECT_URI}#g" "$API_FILE" || true
          UA="android:personal-app:0.0.1 (by /u/${REDDIT_USERNAME})"
          sed -i "s|public static final String USER_AGENT = \".*\";|public static final String USER_AGENT = \"${UA}\";|" "$API_FILE"

          echo "🗝️ Decodificando keystore..."
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "❌ Falta secret KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/Infinity.jks"

          GRADLE_FILE="app/build.gradle"
          [ -f app/build.gradle.kts ] && GRADLE_FILE="app/build.gradle.kts"

          echo "🔏 Ajustando bloque de firma en $GRADLE_FILE..."

          # Si ya existe signingConfigs.release, elimínalo y reemplázalo limpio
          awk '
            BEGIN{ skip=0 }
            /signingConfigs\s*\{/ {print "    signingConfigs {"; print "        release {"; print "            storeFile file(\"" ENVIRON["GITHUB_WORKSPACE"] "/Infinity.jks\")"; print "            storePassword \"" ENVIRON["KEYSTORE_PASS"] "\""; print "            keyAlias \"" ENVIRON["KEY_ALIAS"] "\""; print "            keyPassword \"" ENVIRON["KEY_PASS"] "\""; print "        }"; print "    }"; skip=1; next}
            skip && /\}/ { skip=0; next }
            !skip { print }
          ' "$GRADLE_FILE" > tmp && mv tmp "$GRADLE_FILE"

          # Garantiza que buildTypes.release tenga la referencia correcta
          grep -q 'signingConfig signingConfigs.release' "$GRADLE_FILE" || \
            sed -i '0,/release[[:space:]]*{/{s/release[[:space:]]*{/release {\n            signingConfig signingConfigs.release/}' "$GRADLE_FILE"

          echo "✅ Bloque de firma configurado correctamente."

      # ⚙️ Compilar APK
      - name: Build release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease --stacktrace --info

      # 💾 Subir APK como artefacto privado
      - name: Upload APK (private)
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Private-Release
          path: app/build/outputs/apk/release/*.apk
